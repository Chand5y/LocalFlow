name: Build Local Flow v3 Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Clean Local Flow v3 Project Files
        run: |
          rm -rf app cpp_whisper external build-whisper build-llama build.gradle.kts settings.gradle.kts gradle.properties
          echo "" | base64 -d > payload.zip
          unzip -o payload.zip
          rm -f payload.zip
          if [ -f local_flow_android.zip ]; then
            unzip -o local_flow_android.zip
          fi

      - name: Provision Android SDK, NDK r26b & CMake 3.22.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Compile Real C++ whisper.cpp (v1.7.1) JNI Library for arm64-v8a
        run: |
          git clone --branch v1.7.1 --depth 1 https://github.com/ggerganov/whisper.cpp.git external/whisper.cpp
          $ANDROID_HOME/cmake/3.22.1/bin/cmake -B build-whisper -S cpp_whisper             -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-26             -DCMAKE_BUILD_TYPE=Release             -DBUILD_SHARED_LIBS=OFF             -DWHISPER_BUILD_TESTS=OFF             -DWHISPER_BUILD_EXAMPLES=OFF             -DGGML_OPENMP=OFF
          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build-whisper --config Release -j4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build-whisper/liblocalflow_whisper.so app/src/main/jniLibs/arm64-v8a/

      - name: Compile Real C++ llama.cpp (b3900) Engine for arm64-v8a
        run: |
          git clone --branch b3900 --depth 1 https://github.com/ggerganov/llama.cpp.git external/llama.cpp
          $ANDROID_HOME/cmake/3.22.1/bin/cmake -B build-llama -S external/llama.cpp             -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-26             -DCMAKE_BUILD_TYPE=Release             -DBUILD_SHARED_LIBS=OFF             -DLLAMA_BUILD_TESTS=OFF             -DLLAMA_BUILD_SERVER=OFF             -DLLAMA_BUILD_EXAMPLES=ON             -DGGML_OPENMP=OFF
          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build-llama --target llama-cli --config Release -j4
          cp build-llama/bin/llama-cli app/src/main/jniLibs/arm64-v8a/libllama_cli.so

      - name: Build Signed Debug APK with Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload LocalFlow-v3.0-Native-APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalFlow-v3-Native-APK
          path: app/build/outputs/apk/debug/*.apk
