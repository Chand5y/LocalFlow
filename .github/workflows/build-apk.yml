name: Build Local Flow v4 Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preserve User Uploaded App Icon (if present in repo)
        run: |
          rm -f /tmp/user_app_icon
          for candidate in app_icon.png app_icon.jpg app_icon.jpeg app_icon.webp icon.png icon.jpg ic_launcher.png icons/app_icon.png icons/icon.png; do
            if [ -f "$candidate" ]; then
              echo "Found custom app icon: $candidate"
              cp "$candidate" /tmp/user_app_icon
              break
            fi
          done

      - name: Unpack Clean Local Flow v4 Project Files
        run: |
          rm -rf app cpp_whisper external build-whisper build-llama build.gradle.kts settings.gradle.kts gradle.properties
          echo "" | base64 -d > payload.zip
          unzip -o payload.zip
          rm -f payload.zip
          if [ -f local_flow_android.zip ]; then
            unzip -o local_flow_android.zip
          fi

      - name: Generate Android Launcher Icons (Uses Uploaded Icon or Built-In Default)
        run: |
          python3 -m pip install --quiet Pillow || sudo apt-get install -y python3-pil
          python3 - << 'PY'
          import os
          from PIL import Image, ImageDraw

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          if os.path.exists("/tmp/user_app_icon"):
              print("Applying user-uploaded app icon from repository...")
              base_img = Image.open("/tmp/user_app_icon").convert("RGBA")
          else:
              print("Generating clean default Local Flow launcher icon...")
              base_img = Image.new("RGBA", (512, 512), (13, 110, 82, 255))
              draw = ImageDraw.Draw(base_img)
              bars = [(136, 200, 168, 312), (192, 160, 224, 352), (248, 110, 280, 402), (304, 168, 336, 344), (360, 208, 392, 304)]
              for (x1, y1, x2, y2) in bars:
                  draw.rounded_rectangle([x1, y1, x2, y2], radius=16, fill=(255, 255, 255, 255))

          for folder, px in sizes.items():
              out_dir = os.path.join("app/src/main/res", folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = base_img.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")

              mask = Image.new("L", (px, px), 0)
              mdraw = ImageDraw.Draw(mask)
              mdraw.ellipse((0, 0, px, px), fill=255)
              round_img = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              round_img.paste(resized, (0, 0), mask)
              round_img.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")
          PY

      - name: Provision Android SDK, NDK r26b & CMake 3.22.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Compile Real C++ whisper.cpp (v1.7.1) JNI Library for arm64-v8a
        run: |
          git clone --branch v1.7.1 --depth 1 https://github.com/ggerganov/whisper.cpp.git external/whisper.cpp
          $ANDROID_HOME/cmake/3.22.1/bin/cmake -B build-whisper -S cpp_whisper             -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-26             -DCMAKE_BUILD_TYPE=Release             -DBUILD_SHARED_LIBS=OFF             -DWHISPER_BUILD_TESTS=OFF             -DWHISPER_BUILD_EXAMPLES=OFF             -DGGML_OPENMP=OFF
          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build-whisper --config Release -j4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build-whisper/liblocalflow_whisper.so app/src/main/jniLibs/arm64-v8a/

      - name: Compile Real C++ llama.cpp Engine for arm64-v8a
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git external/llama.cpp
          $ANDROID_HOME/cmake/3.22.1/bin/cmake -B build-llama -S external/llama.cpp             -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-26             -DCMAKE_BUILD_TYPE=Release             -DBUILD_SHARED_LIBS=OFF             -DLLAMA_CURL=OFF             -DLLAMA_BUILD_TESTS=OFF             -DLLAMA_BUILD_SERVER=OFF             -DLLAMA_BUILD_EXAMPLES=ON             -DGGML_OPENMP=OFF
          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build-llama --target llama-cli --config Release -j4
          cp build-llama/bin/llama-cli app/src/main/jniLibs/arm64-v8a/libllama_cli.so

      - name: Build Signed Debug APK with Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload LocalFlow-v4.0-Native-APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalFlow-v4-Native-APK
          path: app/build/outputs/apk/debug/*.apk
