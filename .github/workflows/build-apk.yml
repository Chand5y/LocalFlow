name: Build LocalFlow v15 Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack LocalFlow v15 Project & Custom Launcher Icons
        run: |
          rm -rf app cpp_whisper external build-whisper build-llama build.gradle.kts settings.gradle.kts gradle.properties
          echo "" | base64 -d > payload.zip
          unzip -o payload.zip
          rm -f payload.zip

      - name: Provision Android SDK, NDK r26b & CMake 3.22.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Compile High-Speed ARMv8.2 DotProd whisper.cpp JNI Library (4x Cortex-A77 Core Pinning + UTF-8 Crash Guard)
        run: |
          git clone --branch v1.7.1 --depth 1 https://github.com/ggerganov/whisper.cpp.git external/whisper.cpp
          find external/whisper.cpp -name "CMakeLists.txt" -exec sed -i 's/-ffast-math/-fno-finite-math-only/g' {} +
          sed -i 's/#error/\/\/ #error/g' external/whisper.cpp/ggml/src/ggml.c
          python3 - << 'PY'
          # 1. Pin all 4 ggml worker threads strictly to Cores 4..7 (the 4 Cortex-A77 Big/Prime cores) with priority -16!
          p = "external/whisper.cpp/ggml/src/ggml.c"
          s = open(p, "r", encoding="utf-8").read()
          target = "static thread_ret_t ggml_graph_compute_thread(void * data) {"
          inject = target + '''
          #if defined(__ANDROID__) && defined(__aarch64__)
              setpriority(PRIO_PROCESS, 0, -16);
              int n_cpus = sysconf(_SC_NPROCESSORS_CONF);
              if (n_cpus >= 8) {
                  cpu_set_t mask;
                  CPU_ZERO(&mask);
                  for (int c = 4; c < 8; ++c) CPU_SET(c, &mask);
                  sched_setaffinity(0, sizeof(cpu_set_t), &mask);
              }
          #endif
          '''
          if target in s:
              s = "#include <sched.h>\n#include <unistd.h>\n#include <sys/resource.h>\n" + s.replace(target, inject, 1)
              open(p, "w", encoding="utf-8").write(s)
              print("INJECTED_GGML_4CORE_CORTEX_A77_AFFINITY")

          # 2. Restrict whisper_lang_auto_detect_with_state strictly to English ('en') vs Hindi ('hi')
          wp = "external/whisper.cpp/src/whisper.cpp"
          ws = open(wp, "r", encoding="utf-8").read()
          auto_ret = "return max_language_id;"
          auto_patch = '''
          int id_en = whisper_lang_id("en");
          int id_hi = whisper_lang_id("hi");
          if (lang_probs != nullptr && id_en >= 0 && id_hi >= 0) {
              return (lang_probs[id_hi] > lang_probs[id_en] * 1.10f) ? id_hi : id_en;
          }
          return (max_language_id == id_hi) ? id_hi : id_en;
          '''
          if auto_ret in ws:
              ws = ws.replace(auto_ret, auto_patch, 1)
              open(wp, "w", encoding="utf-8").write(ws)
              print("PATCHED_WHISPER_AUTO_DETECT_STRICT_EN_HI")
          PY
          $ANDROID_HOME/cmake/3.22.1/bin/cmake -B build-whisper -S cpp_whisper \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DGGML_OPENMP=OFF
          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build-whisper --config Release -j4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build-whisper/liblocalflow_whisper.so app/src/main/jniLibs/arm64-v8a/

      - name: Build Signed Debug APK with Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload LocalFlow-v15.0-Native-APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalFlow-v15-Native-APK
          path: app/build/outputs/apk/debug/*.apk
