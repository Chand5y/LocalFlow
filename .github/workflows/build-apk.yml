name: Build Local Flow APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Clean Local Flow Project Files
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          echo "" | base64 -d > payload.zip
          unzip -o payload.zip
          rm -f payload.zip
          if [ -f local_flow_android.zip ]; then
            unzip -o local_flow_android.zip
          fi

      - name: Install Gradle 8.7 & Build LocalFlow.apk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload LocalFlow-v2.0.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalFlow-APK
          path: app/build/outputs/apk/debug/*.apk
